<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Kringo</title>
  <meta name="theme-color" content="#17457f">
  <meta name="description" content="Kringo – CAD voor elektrische schema's in de browser">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Kringo">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <header id="top"></header>
    <main>
      <aside id="left">
        <div id="left-tabs" class="tabs"></div>
        <div id="library" class="panel"></div>
        <div id="pages" class="panel" hidden></div>
      </aside>
      <section id="center">
        <div id="toolbar"></div>
        <div id="canvas"></div>
        <div id="status"></div>
      </section>
      <aside id="right"><div id="props" class="panel"></div></aside>
    </main>
  </div>
  <div id="print-root"></div>
  <noscript>Kringo heeft JavaScript nodig.</noscript>
  <script type="module" src="src/main.js"></script>
</body>
</html>
